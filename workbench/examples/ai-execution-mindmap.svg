<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fcfa"/>
      <stop offset="1" stop-color="#eef4f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173c35"/>
      <stop offset="1" stop-color="#286f5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#173c35" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f8f78"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; }
      .label { font-size: 18px; font-weight: 700; letter-spacing: 3px; }
      .title { font-size: 42px; font-weight: 800; }
      .card-title { font-size: 27px; font-weight: 800; }
      .body { font-size: 20px; font-weight: 500; }
      .small { font-size: 17px; font-weight: 500; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="80" cy="78" r="34" fill="#8b5cf6" opacity="0.10"/>
  <circle cx="1110" cy="112" r="58" fill="#d8ad51" opacity="0.13"/>
  <path d="M0 128 C210 80 360 160 570 110 S920 88 1200 138" fill="none" stroke="#2f8f78" stroke-width="2" opacity="0.14"/>

  <text x="600" y="62" text-anchor="middle" fill="#2f8f78" class="label">FROM IDEA TO DELIVERY</text>
  <text x="600" y="116" text-anchor="middle" fill="#173c35" class="title">让 AI 把事情真正做完</text>

  <g filter="url(#shadow)">
    <rect x="65" y="175" width="300" height="162" rx="24" fill="#f4eeff" stroke="#a98add" stroke-width="2"/>
    <rect x="450" y="155" width="300" height="202" rx="28" fill="url(#hero)"/>
    <rect x="835" y="175" width="300" height="162" rx="24" fill="#e8f6ed" stroke="#58a579" stroke-width="2"/>
  </g>

  <text x="215" y="221" text-anchor="middle" fill="#6e4b9d" class="card-title">人的真实想法</text>
  <text x="215" y="263" text-anchor="middle" fill="#4b3b5e" class="body">经历 · 判断 · 表达欲</text>
  <text x="215" y="301" text-anchor="middle" fill="#74677f" class="small">先记录真实，而不是制造观点</text>

  <text x="600" y="213" text-anchor="middle" fill="#bce5d8" class="label">CODEX + TOOLS</text>
  <text x="600" y="260" text-anchor="middle" fill="#ffffff" class="card-title">理解目标并执行</text>
  <text x="600" y="302" text-anchor="middle" fill="#dceee8" class="body">追问 · 拆解 · 调用工具</text>
  <text x="600" y="333" text-anchor="middle" fill="#bce5d8" class="small">Skill / MCP / 插件</text>

  <text x="985" y="221" text-anchor="middle" fill="#216846" class="card-title">可验收的结果</text>
  <text x="985" y="263" text-anchor="middle" fill="#294d3b" class="body">能打开 · 能使用 · 能交付</text>
  <text x="985" y="301" text-anchor="middle" fill="#577264" class="small">用户真的拿到了想要的东西</text>

  <path d="M365 256 H438" stroke="#2f8f78" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M750 256 H823" stroke="#2f8f78" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="600" y="414" text-anchor="middle" fill="#173c35" class="card-title">一条完整的创作链路</text>
  <line x1="112" y1="477" x2="1088" y2="477" stroke="#b8d5cc" stroke-width="4"/>

  <g>
    <circle cx="140" cy="477" r="31" fill="#8b5cf6"/>
    <circle cx="324" cy="477" r="31" fill="#5678d4"/>
    <circle cx="508" cy="477" r="31" fill="#2f8f78"/>
    <circle cx="692" cy="477" r="31" fill="#d29b42"/>
    <circle cx="876" cy="477" r="31" fill="#cf6f80"/>
    <circle cx="1060" cy="477" r="31" fill="#1e7a55"/>
    <text x="140" y="485" text-anchor="middle" fill="#fff" class="body">1</text>
    <text x="324" y="485" text-anchor="middle" fill="#fff" class="body">2</text>
    <text x="508" y="485" text-anchor="middle" fill="#fff" class="body">3</text>
    <text x="692" y="485" text-anchor="middle" fill="#fff" class="body">4</text>
    <text x="876" y="485" text-anchor="middle" fill="#fff" class="body">5</text>
    <text x="1060" y="485" text-anchor="middle" fill="#fff" class="body">6</text>
    <text x="140" y="535" text-anchor="middle" fill="#3c4b46" class="body">记录</text>
    <text x="324" y="535" text-anchor="middle" fill="#3c4b46" class="body">对话</text>
    <text x="508" y="535" text-anchor="middle" fill="#3c4b46" class="body">写作</text>
    <text x="692" y="535" text-anchor="middle" fill="#3c4b46" class="body">配图</text>
    <text x="876" y="535" text-anchor="middle" fill="#3c4b46" class="body">上传</text>
    <text x="1060" y="535" text-anchor="middle" fill="#3c4b46" class="body">验收</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="65" y="590" width="300" height="124" rx="18" fill="#ffffff" stroke="#d6dedb"/>
    <rect x="450" y="590" width="300" height="124" rx="18" fill="#ffffff" stroke="#d6dedb"/>
    <rect x="835" y="580" width="300" height="144" rx="20" fill="#ecf8f1" stroke="#2f8f78" stroke-width="3"/>
  </g>

  <text x="215" y="630" text-anchor="middle" fill="#69746f" class="label">技术圈看到的 AI</text>
  <text x="215" y="677" text-anchor="middle" fill="#35413d" class="body">模型 · 框架 · 参数</text>

  <text x="600" y="630" text-anchor="middle" fill="#69746f" class="label">内容圈看到的 AI</text>
  <text x="600" y="677" text-anchor="middle" fill="#35413d" class="body">热点 · 流量 · 批量</text>

  <text x="985" y="625" text-anchor="middle" fill="#2f8f78" class="label">用户真正关心</text>
  <text x="985" y="670" text-anchor="middle" fill="#173c35" class="card-title">事情有没有做完？</text>
  <text x="985" y="702" text-anchor="middle" fill="#577264" class="small">技术只是过程，结果才是答案</text>

  <path d="M215 714 C260 780 370 790 463 800" fill="none" stroke="#aebbb6" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M600 714 V788" fill="none" stroke="#aebbb6" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M985 724 C930 780 830 790 737 800" fill="none" stroke="#2f8f78" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="205" y="780" width="790" height="78" rx="39" fill="#173c35"/>
  <text x="600" y="812" text-anchor="middle" fill="#bce5d8" class="small">AI 的价值，不在于它知道多少</text>
  <text x="600" y="842" text-anchor="middle" fill="#ffffff" class="body">而在于最终帮助人完成了什么</text>
</svg>
